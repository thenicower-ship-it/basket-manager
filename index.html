<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basket Manager</title>
<meta name="theme-color" content="#0F2A33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Basket">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%20100%20100%22%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2222%22%20fill%3D%22%230F2A33%22/%3E%3Cpath%20d%3D%22M14%2086%20A40%2040%200%200%201%2086%2086%22%20fill%3D%22none%22%20stroke%3D%22%23FFB84A%22%20stroke-width%3D%222.5%22%20opacity%3D%22.45%22/%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2244%22%20r%3D%2227%22%20fill%3D%22%23E8772E%22/%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%230F2A33%22%20stroke-width%3D%222.6%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M23%2044h54%22/%3E%3Cpath%20d%3D%22M50%2017v54%22/%3E%3Cpath%20d%3D%22M31%2025c8%207%208%2031%200%2038%22/%3E%3Cpath%20d%3D%22M69%2025c-8%207-8%2031%200%2038%22/%3E%3C/g%3E%3Ctext%20x%3D%2250%22%20y%3D%2291%22%20text-anchor%3D%22middle%22%20font-family%3D%22Bricolage%20Grotesque%2Csystem-ui%2Csans-serif%22%20font-weight%3D%22800%22%20font-size%3D%2217%22%20fill%3D%22%23FFFFFF%22%20letter-spacing%3D%221%22%3EBM%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#D9E4E6; --paper:#F5F8F8; --ink:#0F2A33; --muted:#5B7480; --line:#B9CBCF;
  --wood:#A9692B; --wood-ink:#FFFFFF; --good:#2F8F5B; --bad:#C9402A; --led:#FFB84A; --board:#0F2A33; --mine:#FFF1D6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1A20; --paper:#142830; --ink:#E6F0F2; --muted:#8FA8B2; --line:#25414B;
    --wood:#D08A45; --wood-ink:#1A0E03; --good:#4CC384; --bad:#F0705A; --board:#06110F; --mine:#3A2B14;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1A20; --paper:#142830; --ink:#E6F0F2; --muted:#8FA8B2; --line:#25414B;
  --wood:#D08A45; --wood-ink:#1A0E03; --good:#4CC384; --bad:#F0705A; --board:#06110F; --mine:#3A2B14;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.4}
#app{max-width:480px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:26px;font-weight:800;margin:8px 0 2px;letter-spacing:-.02em;line-height:1.1}
h2{font-size:18px;font-weight:800;margin:0 0 8px}
p{margin:0 0 8px}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.board{background:var(--board);color:var(--led);border-radius:16px;padding:14px 14px 12px;margin-top:8px}
.board .meta{display:flex;justify-content:space-between;font-size:14px;color:#9FB4BB;margin-bottom:6px}
.board .scores{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.board .team{font-size:13px;color:#C9D8DC;line-height:1.15}
.board .team.r{text-align:right}
.board .num{font-size:52px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.03em}
.board .sep{font-size:24px;color:#6F8790}
.board .num.r{text-align:right}
.event{margin-top:10px;font-size:15px;color:#E9F1F3;border-top:1px solid #2A444D;padding-top:8px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:14px;width:100%;text-align:left;min-height:48px}
button:focus-visible{outline:3px solid var(--led);outline-offset:2px}
.primary{background:var(--wood);color:var(--wood-ink);font-weight:800;text-align:center;font-size:17px}
.opt{background:var(--paper);color:var(--ink);border:1.5px solid var(--line);margin-bottom:8px}
.opt b{display:block;font-size:17px}
.opt span{font-size:13px;color:var(--muted)}
.opt:active,.primary:active{transform:scale(.98)}
.opt.sel{border-color:var(--wood);box-shadow:inset 0 0 0 1px var(--wood);background:var(--mine)}
.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);text-align:center;font-size:14px;padding:10px}
.ghost[disabled]{opacity:.4;cursor:not-allowed}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.pl{display:grid;grid-template-columns:1fr 78px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.pl:last-child{border-bottom:0}
.pl .n{font-weight:600;font-size:15px}
.pl .s{font-size:12px;color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;transition:width .4s}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{display:block;border:1.5px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;background:var(--paper)}
.seg input{position:absolute;opacity:0}
.seg label:has(input:checked){border-color:var(--wood);box-shadow:inset 0 0 0 1px var(--wood)}
.seg label:has(input:focus-visible){outline:3px solid var(--led)}
.seg b{display:block}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--line);white-space:nowrap}
.win{color:var(--good)} .lose{color:var(--bad)}
.big{font-size:22px;font-weight:800}
.offer{border:2px solid var(--wood)}
.progress{height:6px;background:var(--line);border-radius:3px;margin:10px 0 0;overflow:hidden}
.progress i{display:block;height:100%;background:var(--wood)}
.tr{display:grid;grid-template-columns:26px 1fr auto auto;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;font-size:15px}
.tr .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr.mine{background:var(--mine);font-weight:800}
.tr.cut{border-bottom:2px dashed var(--wood)}
.tr .d{font-size:13px;color:var(--muted);min-width:34px;text-align:right}
.gm{display:grid;grid-template-columns:1fr auto;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.gm:last-child{border-bottom:0}
.gm.mine{font-weight:800}
.tab{padding:10px;text-align:center;font-size:15px}
.st{display:grid;grid-template-columns:1fr 30px 40px 40px 40px;gap:4px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.st:last-child{border-bottom:0}
.st span:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
.st .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st.h{font-size:12px;color:var(--muted);font-weight:600}
.nw{padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.nw:last-child{border-bottom:0}
.nw .s{font-size:12px;color:var(--muted)}
.nw.new{font-weight:600}
.primary[disabled]{opacity:.5;cursor:not-allowed}
.lgs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.lgs .tab{width:auto;flex:1 0 28%;padding:8px 6px;font-size:14px;margin:0}
.tab.on{background:var(--wood);color:var(--wood-ink);font-weight:800;border-color:var(--wood)}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}button:active{transform:none}}

/* ---------- Apariencia de app ---------- */
html,body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{-webkit-user-select:none;user-select:none;touch-action:manipulation}
#topbar{position:sticky;top:0;z-index:20;background:#0F2A33;color:#fff;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;margin-top:calc(-1 * env(safe-area-inset-top,0px));box-shadow:0 2px 10px rgba(0,0,0,.18)}
#topbar .in{max-width:480px;margin:0 auto;display:flex;align-items:center;gap:10px}
#topbar svg{width:34px;height:34px;flex:none}
#topbar .tt{font-weight:800;font-size:17px;letter-spacing:-.01em;line-height:1.1}
#topbar .ts{font-size:12px;color:#9FB4BB;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .tw{min-width:0;flex:1}
#topbar .tr8{font-size:12px;color:#FFB84A;font-weight:700;white-space:nowrap}
body.hasnav #app{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 12px rgba(0,0,0,.08)}
#tabbar .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
#tabbar button{background:transparent;color:var(--muted);border:0;border-radius:10px;padding:6px 2px 4px;min-height:52px;width:100%;text-align:center;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
#tabbar button svg{width:24px;height:24px}
#tabbar button.on{color:var(--wood)}
#tabbar button.on svg{transform:translateY(-1px)}
#tabbar button:active{transform:none;background:var(--bg)}
#splash{position:fixed;inset:0;z-index:100;background:#0F2A33;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .45s ease}
#splash svg{width:132px;height:132px;animation:bmpop .7s cubic-bezier(.2,1.4,.4,1) both;border-radius:30px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
#splash .sn{font-weight:800;font-size:28px;letter-spacing:.06em;animation:bmup .6s .25s ease both}
#splash .ss{font-size:14px;color:#9FB4BB;animation:bmup .6s .4s ease both}
#splash.out{opacity:0;pointer-events:none}
@keyframes bmpop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes bmup{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
#topsave{width:auto;min-height:34px;padding:6px 10px;border-radius:10px;background:#FFB84A;color:#0F2A33;font-weight:800;font-size:13px;text-align:center;flex:none;white-space:nowrap}
#topsave.ok{background:#2F8F5B;color:#fff}
#topoff{max-width:480px;margin:6px auto 0;background:#FFB84A;color:#0F2A33;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:60;background:#0F2A33;color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.code{width:100%;min-height:90px;font:12px ui-monospace,monospace;border:1.5px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);color:var(--ink);word-break:break-all}
@media (prefers-reduced-motion: reduce){#splash svg,#splash .sn,#splash .ss{animation:none}#splash{transition:none}}
/* ---------- Partido: planilla en vivo (v29) ---------- */
body.inmatch #topbar{display:none}
body.inmatch::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--board);z-index:25}
.stk{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);padding:6px 0 2px;margin-top:-6px}
.stk .board{margin-top:0}
.stk .board .num{font-size:44px}
.bx{display:grid;grid-template-columns:minmax(0,1fr) 30px 30px 30px 26px 34px 30px;gap:4px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.bx.o{grid-template-columns:minmax(0,1fr) 30px 30px 30px 42px 34px}
.bx>*:not(:first-child){text-align:right}
.bx .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bx.h{font-size:11px;color:var(--muted);font-weight:700;padding-top:0}
.bx.h .nm,.bx.h>span:first-child{font-weight:700}
.bx.cut{border-top:2px dashed var(--line)}
.bx.bn{opacity:.7}
.bx:last-child{border-bottom:0}
.fbw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
.fb{border-collapse:collapse;font-size:13px;width:100%;font-variant-numeric:tabular-nums}
.fb th,.fb td{padding:6px 5px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.fb th{font-size:11px;color:var(--muted)}
.fb th:first-child,.fb td:first-child{text-align:left;position:sticky;left:0;background:var(--paper);max-width:120px;overflow:hidden;text-overflow:ellipsis}
.fb tr.tot td{font-weight:800;border-bottom:0}
/* ---------- v31: las dos planillas a la vista ---------- */
.board.mb{padding:8px 12px 8px}
.mb .sb{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto minmax(0,1fr);align-items:center;gap:8px}
.mb .tn{font-size:13px;color:#C9D8DC;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb .tn.r{text-align:right}
.mb .num{font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.mb .sep{font-size:20px;color:#6F8790}
.mb .meta{margin:4px 0 0;font-size:12px}
.mb .ev{font-size:13px;color:#E9F1F3;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stk .board.mb .num{font-size:34px}
.card.tw{padding:6px 10px;margin:6px 0}
.tw>div+div{margin-top:6px}
.bx2{display:grid;grid-template-columns:minmax(0,1fr) 24px 24px 24px 24px 16px 28px 26px;gap:3px;align-items:center;padding:2px 0;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.35;font-variant-numeric:tabular-nums}
.bx2>*:not(:first-child){text-align:right}
.bx2 .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bx2.h{font-size:10.5px;color:var(--muted);font-weight:700;border-bottom:1.5px solid var(--line)}
.bx2.h .nm{color:var(--ink);font-size:12.5px;font-weight:800}
.bx2.cut{border-top:1.5px dashed var(--line)}
.bx2.bn{opacity:.65}
.bx2:last-child{border-bottom:0}
/* ---------- Horizontal (v28) ---------- */
.lvl,.lvr{min-width:0}
@media (orientation:landscape) and (max-height:560px){
  #app{max-width:920px;padding:10px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
  #topbar{padding:calc(4px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 4px max(16px,env(safe-area-inset-left,0px))}
  #topbar .in{max-width:920px}
  #topbar svg{width:26px;height:26px}
  #topbar .tt{font-size:15px}
  #tabbar{padding:2px max(4px,env(safe-area-inset-right,0px)) calc(2px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
  #tabbar .in{max-width:680px}
  #tabbar button{flex-direction:row;justify-content:center;min-height:40px;gap:6px;font-size:12px;padding:4px 2px}
  #tabbar button svg{width:20px;height:20px}
  body.hasnav #app{padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}
  #toast{bottom:calc(56px + env(safe-area-inset-bottom,0px))}
  .lv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
  .lv .stk{position:static;margin-top:0;padding:0}
  .card.tw{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .tw>div+div{margin-top:0}
  .bx2{font-size:12px;padding:1px 0;line-height:1.3}
  .board.mb{padding:6px 12px}
  .mb .num,.stk .board.mb .num{font-size:28px}
  .lv>.lvl{position:sticky;top:8px;max-height:calc(100vh - 16px);overflow-y:auto;-webkit-overflow-scrolling:touch}
  .lv .board{margin-top:0;padding:10px 12px}
  .lv .board .num{font-size:40px}
  .lv .event{margin-top:6px;padding-top:6px}
  .lv .card{margin:10px 0}
  .lv>.lvr>.card:first-child{margin-top:0}
}
</style>
</head>
<body>
<div id="splash" onclick="hideSplash()"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#0F2A33"/><path d="M14 86 A40 40 0 0 1 86 86" fill="none" stroke="#FFB84A" stroke-width="2.5" opacity=".45"/><circle cx="50" cy="44" r="27" fill="#E8772E"/><g fill="none" stroke="#0F2A33" stroke-width="2.6" stroke-linecap="round"><path d="M23 44h54"/><path d="M50 17v54"/><path d="M31 25c8 7 8 31 0 38"/><path d="M69 25c-8 7-8 31 0 38"/></g><text x="50" y="91" text-anchor="middle" font-family="Bricolage Grotesque,system-ui,sans-serif" font-weight="800" font-size="17" fill="#FFFFFF" letter-spacing="1">BM</text></svg><div class="sn">BASKET MANAGER</div><div class="ss">Temporada 2026-27</div></div>
<header id="topbar"><div class="in"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#0F2A33"/><path d="M14 86 A40 40 0 0 1 86 86" fill="none" stroke="#FFB84A" stroke-width="2.5" opacity=".45"/><circle cx="50" cy="44" r="27" fill="#E8772E"/><g fill="none" stroke="#0F2A33" stroke-width="2.6" stroke-linecap="round"><path d="M23 44h54"/><path d="M50 17v54"/><path d="M31 25c8 7 8 31 0 38"/><path d="M69 25c-8 7-8 31 0 38"/></g><text x="50" y="91" text-anchor="middle" font-family="Bricolage Grotesque,system-ui,sans-serif" font-weight="800" font-size="17" fill="#FFFFFF" letter-spacing="1">BM</text></svg><div class="tw"><div class="tt">Basket Manager</div><div class="ts" id="topsub">Tu carrera como entrenador</div></div><div class="tr8" id="toprep"></div><button id="topsave" hidden onclick="saveNow()" aria-label="Guardar partida">Guardar</button></div><div id="topoff" hidden role="status">Sin conexión · tu partida se guarda en el teléfono</div></header><div id="toast" role="status" aria-live="polite"></div>
<nav id="tabbar" hidden></nav>
<div id="app"></div>

var PFN=["Jaxon","Khalil","Devon","Isaiah","Mason","Terrence","Malik","Corey","Nolan","Xavier","Dante","Rafael","Jonah","Silas","Emmett","Cyrus","Tavon","Ezra","Marlon","Desmond","Anders","Felix","Rhys","Joaquin"];
var PLN=["Hargrove","Lockett","Pruitt","Denham","Okoye","Valdez","Strand","Whitaker","Ferrer","Mooney","Bellamy","Quartey","Sandoval","Kimura","Ashby","Delacroix","Novak","Fenwick","Oyelaran","Castellan","Thorne","Abara","Brennan","Ramos-Lyle"];
function genProspects(){
  var pool=[],g=0;
  while(pool.length<36&&g++<600){
    var name=pick(PFN)+" "+pick(PLN);
    if(ALL[name]||pool.some(function(x){return x.name===name}))continue;
    pool.push({name:name,pos:pick(["PG","SG","SF","PF","C"])});
  }
  pool.forEach(function(p,i){
    var base=74-i*0.5+rnd(-3,3);
    p.off=clamp(Math.round(base+rnd(-6,6)),46,82);
    p.def=clamp(Math.round(base+rnd(-6,6)),46,82);
    p.so=clamp(p.off+Math.round(rnd(-4,4)),40,90);
    p.sd=clamp(p.def+Math.round(rnd(-4,4)),40,90);
  });
  return pool;
}
function draftOrder(){
  var po={};
  ["E","W"].forEach(function(c){sortIds(confIds(c)).slice(0,8).forEach(function(id){po[id]=1})});
  var non=sortIds(LIDS().filter(function(id){return !po[id]})).reverse();
  var playoff=sortIds(LIDS().filter(function(id){return po[id]})).reverse();
  var pool=non.slice(),w=non.map(function(_,i){return non.length-i}),order=[],k,j;
  for(k=0;k<4&&pool.length;k++){
    var r=Math.random()*sum(w);
    for(j=0;j<pool.length;j++){r-=w[j];if(r<=0)break}
    j=Math.min(j,pool.length-1);
    order.push(pool[j]);pool.splice(j,1);w.splice(j,1);
  }
  return order.concat(pool).concat(playoff);
}
function rookieSal(pickNo){return Math.max(2,Math.round(13-(pickNo-1)*0.38))}
function autoDraft(){
  PLAYLG().forEach(function(lg){
    if(lg===S.lg||!LCFG[lg].draft)return;
    var ord=LIDS(lg).slice().sort(function(a,b){return BASE[a].ovr-BASE[b].ovr});
    S.draft={order:ord,pool:genProspects(),i:0,picks:[],left:false};
    while(S.draft.i<ord.length&&S.draft.pool.length)aiPick();
    S.draft.pool.forEach(function(pr){
      S.fict[pr.name]={pos:pr.pos,off:pr.off,def:pr.def,lg:lg};S.tag[pr.name]="J";
      ALL[pr.name]={name:pr.name,pos:pr.pos,off:pr.off,def:pr.def,home:"FA",fict:true,lg:lg};
    });
    S.draft=null;
  });
}
function startDraft(){
  S.draft={order:draftOrder(),pool:genProspects(),i:0,picks:[],left:false};
  save();showDraft();
}
function draftTo(teamId,pr,pickNo){
  S.fict[pr.name]={pos:pr.pos,off:pr.off,def:pr.def};S.tag[pr.name]="J";
  ALL[pr.name]={name:pr.name,pos:pr.pos,off:pr.off,def:pr.def,home:"FA",fict:true,lg:"nba"};S.fict[pr.name].lg="nba";
  S.own[pr.name]=teamId;S.sal[pr.name]=rookieSal(pickNo);S.yrs[pr.name]=3;
  TEAMS[teamId].pl.push({name:pr.name,pos:pr.pos,off:pr.off,def:pr.def});
  sortTeam(teamId);
  S.draft.picks.push({pick:pickNo,team:teamId,name:pr.name,pos:pr.pos,off:pr.off,def:pr.def});
}
function trimAI(id,rookie){
  var pl=TEAMS[id].pl;
  if(pl.length<=9)return;
  var worst=null;
  pl.forEach(function(p){if(p.name===rookie)return;if(!worst||(p.off+p.def)<(worst.off+worst.def))worst=p});
  if(worst){pl.splice(pl.indexOf(worst),1);S.own[worst.name]="FA"}
}
function aiPick(){
  var d=S.draft,pool=d.pool,team=d.order[d.i];
  pool.sort(function(a,b){return (b.off+b.def)-(a.off+a.def)});
  var r=Math.random(),k=r<0.6?0:r<0.85?1:2;
  k=Math.min(k,pool.length-1);
  var pr=pool.splice(k,1)[0];
  draftTo(team,pr,d.i+1);

  d.i++;

  h+='<button class="primary" onclick="endDraft()">Continuar</button>';

function aiFillAll(){
  var changed=false;
  shuffle(IDS).forEach(function(id){
    if(id===S.my)return;
    var lg=TEAMS[id].lg,g=0;
    if(LCFG[lg].guest)return;
    while(TEAMS[id].pl.length<9&&g++<12){
      var pool=faList(lg).filter(function(f){return capOK(id,f.name)});
      if(!pool.length){genFict(4,lg);pool=faList(lg).filter(function(f){return capOK(id,f.name)})}
      if(!pool.length)break;
      var room=S.bud[id]-payroll(id),f=null,k;
      for(k=0;k<pool.length;k++){if(pool[k].ask<=room){f=pool[k];break}}
      if(!f)f=pool[pool.length-1];
      TEAMS[id].pl.push({name:f.name,pos:f.pos,off:f.off,def:f.def});
      S.own[f.name]=id;S.sal[f.name]=f.ask;S.yrs[f.name]=f.yrs;
      sortTeam(id);changed=true;

  });

function finishYear(){
  var mine={},freed=[];
  if(S.cx)S.cx.list.forEach(function(it){mine[it.name]=1});
  IDS.forEach(function(id){
    if(LCFG[TEAMS[id].lg].guest)return;
    var other=TEAMS[id].lg!==S.lg;
    TEAMS[id].pl.slice().forEach(function(p){
      if(mine[p.name])return;
      var y=S.yrs[p.name]||1;
      if(y<=1){
        var tag=tagOf(null,p),stay=((p.off+p.def)/2>=80)?0.95:0.75;
        if(Math.random()<stay){S.sal[p.name]=estSal(p.off,p.def,tag);S.yrs[p.name]=offerYears(tag)}
        else{
          TEAMS[id].pl.splice(TEAMS[id].pl.indexOf(p),1);S.own[p.name]="FA";
          if(!other)freed.push({name:p.name,team:id,ovr:Math.round((p.off+p.def)/2)});
        }
      }else S.yrs[p.name]=y-1;
    });
  });
  freed.sort(function(a,b){return b.ovr-a.ovr});

function proposeTrade(){
  var t=TEAMS[TR.id],mine=TEAMS[S.my].pl;
  if(TR.want.length!==TR.give.length||!TR.want.length||TR.want.length>2)return;
  var want=TR.want.map(function(i){return t.pl[i]}),give=TR.give.map(function(i){return mine[i]});
  var vw=sum(want.map(playerVal)),vg=sum(give.map(playerVal));
  var sw=sum(want.map(function(p){return S.sal[p.name]})),sg=sum(give.map(function(p){return S.sal[p.name]}));
  var myNew=payroll(S.my)-sg+sw,aiNew=payroll(TR.id)-sw+sg,msg="";
  var mr=nbaMatch(S.my,myNew,sg,sw),ar=nbaMatch(TR.id,aiNew,sw,sg);
  if(!tradeOpen())msg="Ya pasó la fecha límite de cambios.";
  else if(mr==="tope")msg="Te pasarías del tope duro ("+capL().apr+" M): por encima de ese número no podés recibir más sueldo del que das.";
  else if(mr==="125")msg="Estás por encima del tope salarial: el sueldo que recibís no puede superar en más de 25% al que das ("+Math.round(sg)+" M → máximo "+Math.round(sg*1.25+1)+" M).";
  else if(ar)msg="Ese equipo quedaría por encima del tope salarial: el sueldo que recibe no puede superar en más de 25% al que da.";
  else if(vg<vw*1.12)msg="No aceptan: piden más valor por lo que pedís.";
  if(msg){TR.msg=msg;showTrade(true);return}
  want.forEach(function(p){t.pl.splice(t.pl.indexOf(p),1);mine.push(p);S.own[p.name]=S.my});

  $('<h1 class="win">¡Cambio aceptado!</h1><div class="card"><p>Llegan: <b>'+names(want)+'</b></p><p>Se van: <b>'+names(give)+'</b></p></div>'+

function signFA(i){

  if(!f)return;

  TEAMS[S.my].pl.push({name:f.name,pos:f.pos,off:f.off,def:f.def});

  showFA("Fichaste a "+f.name+".");
}
function cutPlayer(i){
  var pl=TEAMS[S.my].pl;
  if(pl.length<=8){CUTARM=-1;showRoster("Necesitás al menos 8 jugadores.");return}
  if(CUTARM!==i){CUTARM=i;showRoster();return}

/* ---------- Partido ---------- */
var EFF_A=0.75,COST=5,REC=7,OPP_TIRE=0.55;
function eff(p,k){return p[k]*(EFF_A+(1-EFF_A)*p.en/100)}
function court(){return M.roster.slice(0,5)}
function bench(){return M.roster.slice(5)}
function teamVal(k){var c=court(),s=0;for(var i=0;i<5;i++)s+=eff(c[i],k);return s/5}
function playGame(opp){
  var hl=healthy(S.my).slice(),nr=0;
  while(hl.length<7){nr++;hl.push({name:"Suplente "+nr,pos:"G",off:55,def:55})}
  var r=hl.map(function(p){return {name:p.name,pos:p.pos,off:p.off,def:p.def,en:enOf(p.name),pts:0,a:attrs(p)}});
  var os=calcStr(opp,healthy(opp));
  M={roster:r,i:0,n:S.mode,me:0,op:0,tos:3,tm:false,ot:0,oppEn:avgEn(opp),cx:curCx(),
     opp:{id:opp,A:oppAttrs(opp),name:TEAMS[opp].name,o:os.o+adjOf(opp),d:os.d+adjOf(opp)},
     event:"Salta la pelota. Tenés el quinteto inicial en cancha."};
  showMoment();
}
function simMine(opp){
  var r=simGame(S.my,opp,curCx(),homeH());
  var res=commitMine(r[0],r[1],opp);
  showQuick(res);
}
function resultNote(res){
  if(res.ctx==="wc"){
    if(!res.win)return "Perdiste en el Mundial de clubes.";
    return S.wc&&S.wc.champ===S.my?"¡Son campeones del Mundial de clubes!":"¡Pasás a la final del Mundial de clubes!";
  }
  if(res.ctx==="cup"){
    var C=S.cup[res.cup],nm=CUPS[res.cup].name;
    if(res.ev.t==="C"){var s=C.st[S.my];return nm+": "+s.w+" - "+s.l+" en la fase de grupos"+(res.ev.n===C.sched.length-1?" (terminada).":".")}
    if(!res.win)return "Quedaste eliminado de la "+nm+".";
    return res.ev.n===2?"¡Son los campeones de la "+nm+"!":"Pasás a la siguiente ronda de la "+nm+".";
  }
  if(res.ctx==="reg"){
    if(S.phase==="po")return "Terminó la temporada regular. "+(S.madePO?"¡Clasificaste a los playoffs!":myOppPO()?"Jugás el play-in por un lugar en los playoffs.":"No clasificaste a los playoffs.");
    var s=S.st[S.my],cr=tblIds(TEAMS[S.my].conf).indexOf(S.my)+1;
    return "Récord "+s.w+" - "+s.l+" · puesto "+cr+" "+confPhrase(TEAMS[S.my].conf)+".";
  }
  if(res.note)return res.note;
  if(!res.win)return "Quedaste eliminado de los playoffs.";
  return S.phase==="end"?"¡Son los campeones de la "+LC().name+"!":"Pasás a la siguiente ronda.";
}
function showQuick(res){
  $('<h1 class="'+(res.win?"win":"lose")+'">'+(res.win?"¡Victoria!":"Derrota")+'</h1>'+
    '<div class="card"><div class="row"><span>'+TEAMS[S.my].name+'</span><b class="big">'+res.pa+'</b></div>'+
    '<div class="row"><span>'+TEAMS[res.opp].name+'</span><b class="big">'+res.pb+'</b></div>'+
    '<p class="muted" style="margin-top:8px">Partido simulado.</p></div>'+
    newsHTML(res)+'<p>'+resultNote(res)+'</p><button class="primary" onclick="showHub()">Continuar</button>');
}
function clockLabel(){
  var e=M.i*48/M.n,q=Math.floor(e/12)+1,left=Math.ceil(12-(e%12));
  return "Cuarto "+q+" · quedan "+left+"'";
}
function barColor(v){return v>=65?"var(--good)":v>=40?"var(--led)":"var(--bad)"}
function shortName(n){var p=n.split(" ");return p[0].charAt(0)+". "+p.slice(1).join(" ")}
function boardHTML(label){
  return '<div class="board"><div class="meta"><span>'+label+'</span><span>Tiempos muertos: '+M.tos+'</span></div>'+
  '<div class="scores"><div><div class="team">'+TEAMS[S.my].name+'</div><div class="num">'+M.me+'</div></div>'+
  '<div class="sep">:</div><div><div class="team r">'+M.opp.name+'</div><div class="num r">'+M.op+'</div></div></div>'+
  '<div class="event">'+M.event+'</div></div>';
}
function showMoment(){
  var c=court(),b=bench(),rows="",i,k,j;
  for(i=0;i<5;i++){
    rows+='<div class="pl"><div><div class="n">'+shortName(c[i].name)+'</div><div class="s">'+c[i].pos+' · ATQ '+c[i].off+' · DEF '+c[i].def+'</div></div>'+
    '<div><div class="bar"><i style="width:'+Math.round(c[i].en)+'%;background:'+barColor(c[i].en)+'"></i></div><div class="s" style="text-align:right">'+Math.round(c[i].en)+'%</div></div></div>';
  }
  var worst=0,bestB=0;
  for(k=1;k<5;k++)if(c[k].en<c[worst].en)worst=k;
  for(j=1;j<b.length;j++)if(b[j].en>b[bestB].en)bestB=j;
  var canSub=b[bestB].en>c[worst].en+10;
  var subTxt=canSub?"Entra "+shortName(b[bestB].name)+" por "+shortName(c[worst].name):"Sin cambios útiles";
  $(boardHTML(clockLabel()+' · momento '+(M.i+1)+'/'+M.n+(M.ot?' · prórroga':''))+
    '<div class="card"><h2>En cancha</h2>'+rows+'</div>'+
    '<h2 style="margin-top:14px">¿Qué hacés ahora?</h2>'+
    '<button class="opt" onclick="play(\'bal\')"><b>Equilibrado</b><span>Sin riesgos, cansancio normal</span></button>'+
    '<button class="opt" onclick="play(\'atk\')"><b>Ataque</b><span>Más puntos, pero te cansás más y defendés peor</span></button>'+
    '<button class="opt" onclick="play(\'def\')"><b>Defensa</b><span>Menos posesiones y frenás al rival, pero anotás menos</span></button>'+
    '<button class="opt" onclick="play(\'tri\')"><b>Forzar triples</b><span>Más riesgo, más premio. Tiro de tu quinteto: '+Math.round(cAvg('tir'))+'.</span></button>'+
    '<div class="two"><button class="ghost" '+(M.tos>0?'':'disabled')+' onclick="timeout()">Tiempo muerto</button>'+
    '<button class="ghost" '+(canSub?'':'disabled')+' onclick="sub('+worst+','+(bestB+5)+')">'+subTxt+'</button></div>'+
    '<p class="muted" style="margin-top:6px">El tiempo muerto recupera energía y baja el ataque del rival en el próximo tramo.</p>');
}
function timeout(){
  if(M.tos<=0)return;
  M.tos--;M.tm=true;
  court().forEach(function(p){p.en=Math.min(100,p.en+14)});
  M.event="Tiempo muerto. El quinteto respira y el rival pierde el ritmo.";
  showMoment();
}
function sub(ci,bi){
  var t=M.roster[ci];M.roster[ci]=M.roster[bi];M.roster[bi]=t;
  M.event="Cambio: entra "+shortName(M.roster[ci].name)+" por "+shortName(M.roster[bi].name)+".";
  showMoment();
}
function shot(off,def,strat,mine){
  var three=Math.random()<(strat==="tri"?0.55:0.28);
  var p=0.52+(off-def-(M&&M.cx?M.cx.lg:LG))/200-(three?0.13:0);
  p=clamp(p,0.2,0.75);
  if(Math.random()<p){var pts=three?3:2;if(mine)credit(pts);return pts}
  return 0;
}
function credit(pts){
  var c=court(),w=[],tot=0,i;
  for(i=0;i<5;i++){var v=Math.max(1,eff(c[i],"off")-40);w.push(v);tot+=v}
  var r=Math.random()*tot;
  for(i=0;i<5;i++){r-=w[i];if(r<=0){c[i].pts+=pts;return}}
  c[4].pts+=pts;
}
function oppStrat(){
  var diff=M.me-M.op,e=M.i*48/M.n;
  if(e>36&&diff>0&&Math.random()<0.6)return diff>5?"def":"tri";
  if(e>36&&diff<0&&Math.random()<0.5)return "atk";
  var r=Math.random();
  return r<0.6?"bal":r<0.75?"atk":r<0.9?"def":"tri";
}
function segment(strat,N){
  var os=oppStrat(),sm=STRATS[strat],so=STRATS[os];
  var ma=M.cx&&M.cx.adj?(M.cx.adj[S.my]||0):0,myO=teamVal("off")+sm.o+ma,myD=teamVal("def")+sm.d+ma;
  var of=EFF_A+(1-EFF_A)*M.oppEn/100;
  var opO=M.opp.o*of+so.o,opD=M.opp.d*of+so.d;
  if(M.tm){opO-=6;M.tm=false}
  var n=N;
  if(strat==="def")n-=Math.round(N*0.15);
  if(os==="def")n-=Math.round(N*0.15);
  n=Math.max(3,n);
  var my=0,op=0,i;
  for(i=0;i<n;i++){my+=shot(myO,opD,strat,true);op+=shot(opO,myD,os,false)}
  M.me+=my;M.op+=op;
  return {my:my,op:op,os:os};
}
function fatigue(strat){
  var sc=12/M.n*(M.i>=M.n?5/6:1);
  var cost=(COST+(strat==="atk"?2:strat==="tri"?1:0))*sc;
  court().forEach(function(p){p.en=Math.max(5,p.en-cost-rnd(-1,2));p.mn=(p.mn||0)+sc});
  M.oppEn=Math.max(30,M.oppEn-cost*OPP_TIRE);
  bench().forEach(function(p){p.en=Math.min(100,p.en+REC*sc)});
}
function describe(r){
  var d=r.my-r.op,t="";
  if(d>=9)t="¡Parcial de "+r.my+"-"+r.op+" a tu favor! Estás imparable.";
  else if(d<=-9)t="Racha del rival: "+r.op+"-"+r.my+". Pensá en pedir tiempo muerto.";
  else if(d>0)t="Tramo ganado "+r.my+"-"+r.op+".";
  else if(d<0)t="Tramo perdido "+r.my+"-"+r.op+".";
  else t="Tramo empatado "+r.my+"-"+r.op+".";
  if(r.os==="tri")t+=" El rival tiró muchos triples.";
  if(r.os==="def")t+=" El rival cerró su defensa.";
  var avg=0;court().forEach(function(p){avg+=p.en});avg/=5;
  if(avg<50)t+=" Tu quinteto está muy cansado.";
  return t;
}
function play(strat){
  var N=Math.round((M.cx?M.cx.poss:LC().poss)/M.n);
  var r=segment(strat,N);
  fatigue(strat);
  M.event=describe(r);
  M.i++;
  if(M.i<M.n){showMoment();return}
  if(M.me===M.op){overtime();return}
  finish();
}
function overtime(){
  M.ot++;
  var r=segment("bal",Math.round(10*(M.cx?M.cx.poss:LC().poss)/100));
  fatigue("bal");
  M.event="Prórroga "+M.ot+": "+r.my+"-"+r.op+".";
  if(M.me===M.op&&M.ot<4){overtime();return}
  if(M.me===M.op)M.me++;
  finish();
}
function finish(){
  LIVEPTS={};LIVEMIN={};M.roster.forEach(function(p){LIVEPTS[p.name]=p.pts;LIVEMIN[p.name]=26*(p.mn||0)/12});
  var res=commitMine(M.me,M.op,M.opp.id);
  LIVEPTS=null;LIVEMIN=null;
  var top=M.roster.filter(function(p){return p.pts>0}).sort(function(a,b){return b.pts-a.pts}).slice(0,3);
  var tops=top.map(function(p){return '<div class="row"><span>'+p.name+' <span class="muted">'+p.pos+'</span></span><b>'+p.pts+' pts</b></div>'}).join("");
  $('<h1 class="'+(res.win?"win":"lose")+'">'+(res.win?"¡Victoria!":"Derrota")+'</h1>'+
    boardHTML("Final"+(M.ot?" · tras prórroga":""))+
    '<div class="card"><h2>Figuras de tu equipo</h2>'+tops+'</div>'+
    newsHTML(res)+'<p>'+resultNote(res)+'</p><button class="primary" onclick="showHub()">Continuar</button>');
}

function newsLabel(){return S.wc&&!S.wc.done?"Mundial de clubes":S.phase==="reg"&&S.sched?"Fecha "+Math.min(S.rnd+1,S.sched.length):S.phase==="po"?"Playoffs":"Fin de temporada"}
function addNews(t,k){

function injNews(id,p,g){

function streak(win){

  if(k===5||k===10)addNews("¡Racha de "+k+" victorias seguidas! La afición está ilusionada.","rac");
  if(k===-5)addNews("Cinco derrotas seguidas. La directiva pide reaccionar ya.","dir");

function boardStart(){
  if(!S.my||!RANKL[S.my])return;
  var e=RANKL[S.my],n=LSIZE[S.lg],cut=Math.round(LC().groups.length*fmtOf().cut*0.85),t;
  if(e<=Math.max(2,Math.round(n*0.15)))t="La directiva quiere pelear el título.";

function boardMid(){

  var act=sortIds(LIDS()).indexOf(S.my)+1,exp=RANKL[S.my],t;

  else if(act>=exp+3)t="La directiva está preocupada: van "+act+"º y se esperaba el "+exp+"º."+(S.rep<40?" Si no mejora, tu puesto corre peligro.":"");
  else t="La directiva ve al equipo donde se esperaba: puesto "+act+".";

}
function aiTrade(){
  var ids=shuffle(LIDS().filter(function(i){return i!==S.my}));
  if(ids.length<2)return;
  var A=ids[0],B=ids[1],m=injMap();
  var ca=TEAMS[A].pl.slice(1,8).filter(function(p){return !(m[p.name]>0)});
  if(!ca.length)return;
  var pa=pick(ca),va=playerVal(pa),sa=S.sal[pa.name]||0,best=null,bd=1e9;
  TEAMS[B].pl.slice(1,8).forEach(function(p){
    if(m[p.name]>0)return;
    var v=playerVal(p),sb=S.sal[p.name]||0,dv=Math.abs(v-va);
    if(dv>va*0.15+60)return;
    if(sb>sa&&payroll(A)-sa+sb>S.bud[A])return;
    if(sa>sb&&payroll(B)-sb+sa>S.bud[B])return;
    if(dv<bd){bd=dv;best=p}
  });
  if(!best)return;
  TEAMS[A].pl.splice(TEAMS[A].pl.indexOf(pa),1);TEAMS[B].pl.splice(TEAMS[B].pl.indexOf(best),1);
  TEAMS[A].pl.push(best);TEAMS[B].pl.push(pa);S.own[best.name]=A;S.own[pa.name]=B;
  sortTeam(A);sortTeam(B);rebuildBase();refreshStr();
  addNews("Cambio en la liga: "+pa.name+" pasa de "+TEAMS[A].name+" a "+TEAMS[B].name+", y "+best.name+" hace el camino inverso.","mer");
}

/* ---------- Estadisticas ---------- */
var LIVEPTS=null,STK="p";
var RW={PG:0.6,SG:0.8,SF:1,PF:1.35,C:1.65},AW={PG:2.3,SG:1.2,SF:1,PF:0.7,C:0.55};
function distrib(tot,w){
  var s=0,a=w.map(function(x){var v=x*Math.exp(randn()*0.3);s+=v;return v});
  if(!s||tot<=0)return a.map(function(){return 0});
  var f=a.map(function(v){return Math.floor(v/s*tot)}),left=tot-sum(f);
  a.map(function(v,i){return {i:i,d:v/s*tot-f[i]}}).sort(function(x,y){return y.d-x.d}).slice(0,left).forEach(function(o){f[o.i]++});
  return f;
}
function box(id,pts){
  if(!S.ps)S.ps={};
  var pl=healthy(id).slice(0,11);
  if(!pl.length)return;
  var P=LC().pts,mn=pl.map(function(p,i){return i<5?1:i<8?0.45:0.12});
  var live=id===S.my&&LIVEPTS;
  var pp=live?pl.map(function(p){return LIVEPTS[p.name]||0}):distrib(pts,pl.map(function(p,i){return mn[i]*Math.pow(Math.max(2,p.off-40),1.6)}));
  var rb=distrib(Math.round(P*0.4*rnd(0.85,1.15)),pl.map(function(p,i){return mn[i]*Math.max(2,attrs(p).reb-35)*Math.sqrt(RW[p.pos]||1)}));
  var as=distrib(Math.round(P*0.22*rnd(0.8,1.2)),pl.map(function(p,i){return mn[i]*Math.max(2,attrs(p).pas-35)*Math.sqrt(AW[p.pos]||1)}));
  var pv=pl.map(function(p,i){return Math.round(0.62*pp[i]+rb[i]+as[i]+mn[i]*((attrs(p).dfn-45)/12-1.5)+randn()*1.5)});
  if(live&&LIVEBOX){rb=pl.map(function(p){return LIVEBOX[p.name]?LIVEBOX[p.name][0]:0});as=pl.map(function(p){return LIVEBOX[p.name]?LIVEBOX[p.name][1]:0});pv=pl.map(function(p){return LIVEBOX[p.name]&&LIVEBOX[p.name][2]!=null?LIVEBOX[p.name][2]:0})}
  pl.forEach(function(p,i){
    var r=S.ps[p.name]||(S.ps[p.name]=[0,0,0,0,id]);
    r[0]++;r[1]+=pp[i];r[2]+=rb[i];r[3]+=as[i];r[4]=id;r[5]=(r[5]||0)+pv[i];r[6]=(r[6]||0)+1;
    if(pp[i]>=Math.round(P*0.44))addNews((id===S.my?"¡":"")+p.name+(id===S.my?"":" ("+TEAMS[id].name+")")+" anotó "+pp[i]+" puntos en un partido"+(id===S.my?"!":"."),"rec");
  });
}
function statRows(all){
  var ps=S.ps||{},mx=0,out=[];
  Object.keys(ps).forEach(function(n){mx=Math.max(mx,ps[n][0])});
  var min=all?1:Math.max(1,Math.floor(mx*0.5));
  Object.keys(ps).forEach(function(n){var r=ps[n];if(r[0]<min)return;out.push({n:n,g:r[0],p:r[1]/r[0],r:r[2]/r[0],a:r[3]/r[0],v:r[6]?r[5]/r[6]:0,t:r[4]})});
  return out;
}
function f1(v){return (Math.round(v*10)/10).toFixed(1)}
function showStats(k){
  if(k)STK=k;

/* ---------- Premios e historial ---------- */
function seasonName(s){var y=2025+s;return y+"-"+String(y+1).slice(2)}
function seasonAwards(){
  var rows=statRows();
  if(!rows.length)return null;
  function wp(x){var s=S.st[x.t];return s?s.w/Math.max(1,s.w+s.l):0.5}
  function mv(x){return (x.p+0.7*x.r+0.9*x.a)*(0.55+0.9*wp(x))}
  function pk(x){return x?{n:x.n,t:x.t,p:+f1(x.p),r:+f1(x.r),a:+f1(x.a),v:+f1(x.v||0)}:null}
  function best(f,list){return (list||rows).slice().sort(function(a,b){return f(b)-f(a)})[0]}
  var young=rows.filter(function(x){return tagOf(null,{name:x.n})==="J"});
  return {mvp:pk(best(mv)),pts:pk(best(function(x){return x.p})),reb:pk(best(function(x){return x.r})),ast:pk(best(function(x){return x.a})),pir:pk(best(function(x){return x.v})),jov:pk(young.length?best(mv,young):null)};
}
function awLine(lbl,x,k){
  if(!x)return "";
  var v=k==="v"?f1(x.v)+' de PIR':k==="p"?f1(x.p)+' pts':k==="r"?f1(x.r)+' reb':k==="a"?f1(x.a)+' ast':f1(x.p)+' pts · '+f1(x.r)+' reb · '+f1(x.a)+' ast';
  return '<div class="nw'+(x.t===S.my?' new':'')+'"><div class="s">'+lbl+'</div>'+x.n+' <span class="muted">· '+TEAMS[x.t].name+' · '+v+'</span></div>';
}
function awardsHTML(aw){
  return '<div class="card"><h2>Premios de la temporada</h2>'+awLine("MVP",aw.mvp,"")+awLine("Máximo anotador",aw.pts,"p")+awLine("Máximo reboteador",aw.reb,"r")+awLine("Máximo asistidor",aw.ast,"a")+awLine("Mejor valoración (PIR)",aw.pir,"v")+awLine("Mejor joven",aw.jov,"")+'</div>';
}
function seasonClose(aw,act,cups){
  var fg=S.po&&S.po.games&&S.po.games[0],ru=fg&&fg.w!=null?(fg.w===fg.a?fg.b:fg.a):null;
  var res=!S.madePO?"sin playoffs":S.champ===S.my?"campeón":ru===S.my?"subcampeón":S.poWins+(S.poWins===1?" ronda ganada en playoffs":" rondas ganadas en playoffs");
  var st=S.st[S.my];
  if(!S.hist)S.hist=[];
  S.hist.push({s:S.season,lg:S.lg,ch:S.champ,ru:ru,aw:aw,my:S.my,w:st.w,l:st.l,pos:act,res:res,
    cups:(cups||[]).map(function(x){return {c:x.c,ch:x.champ||null,my:x.my||null}}),rep:S.rep,wc:S.wc&&S.wc.done?S.wc.champ:null,wcmy:S.wc&&S.wc.my||null});
  if(S.hist.length>40)S.hist=S.hist.slice(-40);
  addNews(TEAMS[S.champ].name+" es el campeón de la "+LC().name+"."+(S.champ===S.my?" ¡Felicitaciones, entrenador!":""),"prem");
  if(aw&&aw.mvp)addNews(aw.mvp.n+" ("+TEAMS[aw.mvp.t].name+") es el MVP de la temporada.","prem");
  if(S.fin.fired)addNews("La directiva decidió despedirte. Tenés ofertas de otros equipos.","dir");
  else S.fin.offers.forEach(function(id){addNews(TEAMS[id].name+" te ofrece ser su entrenador.","dir")});
}
function palmares(){
  var H=S.hist||[],p={t:H.length,lg:0,intl:0,nat:0,po:0,fin:0,eq:{},mvp:0,wc:0};
  H.forEach(function(x){
    if(x.ch===x.my)p.lg++;
    if(x.ru===x.my||x.ch===x.my)p.fin++;
    if(x.res!=="sin playoffs")p.po++;
    (x.cups||[]).forEach(function(c){if(c.my==="campeon"){if(CUPS[c.c]&&CUPS[c.c].nat)p.nat++;else p.intl++}});
    if(x.aw&&x.aw.mvp&&x.aw.mvp.t===x.my)p.mvp++;
    if(x.wcmy==="campeon")p.wc++;
    p.eq[x.my]=1;
  });
  p.eq=Object.keys(p.eq).map(function(id){return TEAMS[id].name});
  return p;
}

/* ---------- Cantera ---------- */
function genYouth(quiet){
  if(!S.my||LC().draft||!LCFG[S.lg].fict){S.youth=null;return}
  var F=LCFG[S.lg].fict,list=[],g=0;
  while(list.length<3&&g++<300){
    var name=pick(F.first)+" "+pick(F.last);
    if(ALL[name]||list.some(function(y){return y.name===name}))continue;
    var cur=rnd(F.min-6,F.min),gem=Math.random()<0.12;
    var pot=Math.round(gem?rnd(F.max+4,F.max+12):rnd(F.min+4,F.max+2)),sp=Math.round(rnd(-4,4));
    list.push({name:name,pos:pick(["PG","SG","SF","PF","C"]),off:Math.max(30,Math.round(cur+rnd(-3,3))),def:Math.max(30,Math.round(cur+rnd(-3,3))),pot:pot,lo:pot-6+sp,hi:pot+6+sp,sc:false,up:false});
  }
  S.youth={s:S.season,list:list,used:false};
  if(!quiet)addNews("Llegaron "+list.length+" juveniles nuevos a la cantera. Podés verlos en Cantera.","can");
}
function showYouth(msg){
  var Y=S.youth;
  if(!Y){showHub();return}
  var h='<h1>Cantera</h1><p class="muted">Cada temporada llegan 3 juveniles. Los que no subas al plantel se van cuando termina la temporada. El potencial es el nivel promedio que pueden llegar a tener.</p>';
  if(msg)h+='<div class="card offer"><p>'+msg+'</p></div>';
  h+='<div class="card"><div class="row"><span>Ojeador</span><b>'+(Y.used?'ya trabajó esta temporada':'disponible')+'</b></div><p class="muted" style="margin-top:6px">Una vez por temporada puede estudiar a un juvenil y decirte su potencial real.</p></div>';
  Y.list.forEach(function(y,i){
    var pt=y.sc?'Potencial real: <b>'+y.pot+'</b> (según el ojeador)':'Potencial estimado: '+y.lo+' a '+y.hi;
    h+='<div class="card" style="padding:12px"><div style="font-weight:600">'+y.name+'</div><div class="muted">'+y.pos+' · juvenil · ATQ '+y.off+' · DEF '+y.def+'</div><p style="margin:6px 0 0">'+pt+'</p>';
    if(y.up)h+='<p class="win" style="margin:6px 0 0"><b>Ya está en el plantel</b></p>';
    else h+='<div class="two" style="margin-top:8px"><button class="ghost" '+(Y.used||y.sc?'disabled':'')+' onclick="scoutY('+i+')">Mandar ojeador</button><button class="primary" style="font-size:15px;padding:10px" onclick="promoteY('+i+')">Subir al plantel</button></div>';
    h+='</div>';
  });
  h+='<p class="muted">Subir a un juvenil cuesta 1 M por año, con contrato de 3 años. Crecen más rápido mientras estén lejos de su potencial.</p>';
  $(h+'<button class="primary" onclick="showHub()">Volver</button>');
}
function scoutY(i){
  var Y=S.youth;if(!Y||Y.used||!Y.list[i])return;
  Y.used=true;Y.list[i].sc=true;save();
  showYouth("El ojeador estudió a "+Y.list[i].name+": su potencial real es "+Y.list[i].pot+".");
}
function promoteY(i){
  var Y=S.youth,y=Y&&Y.list[i];
  if(!y||y.up)return;
  if(TEAMS[S.my].pl.length>=rMax()){showYouth("Tu plantilla ya tiene "+rMax()+" jugadores. Cortá a alguno desde Plantilla primero.");return}
  if(payroll(S.my)+1>S.bud[S.my]){showYouth("No te alcanza el tope de sueldos para subirlo.");return}
  S.fict[y.name]={pos:y.pos,off:y.off,def:y.def,lg:S.lg};S.tag[y.name]="J";S.pot[y.name]=y.pot;
  ALL[y.name]={name:y.name,pos:y.pos,off:y.off,def:y.def,home:"FA",fict:true,lg:S.lg};
  S.own[y.name]=S.my;S.sal[y.name]=1;S.yrs[y.name]=3;
  TEAMS[S.my].pl.push({name:y.name,pos:y.pos,off:y.off,def:y.def});
  sortTeam(S.my);rebuildBase();refreshStr();y.up=true;
  addNews(y.name+" sube de la cantera al primer equipo.","can");save();
  showYouth("¡"+y.name+" ya es parte del plantel!");
}

var RIVALS=[["LAL","BOS"],["LAL","LAC"],["NYK","BKN"],["CHI","DET"],["BOS","PHI"],
  ["A_RMB","A_BAR"],["A_BAR","A_JOV"],["A_BSK","A_BIL"],
  ["G_OLY","G_PAO"],["G_ARI","G_PAOK"],["G_AEK","G_PAO"],
  ["T_FEN","T_EFE"],["T_FEN","T_GAL"],["T_GAL","T_BES"],
  ["I_MTA","I_HTA"],["I_MTA","I_HJE"],["I_HJE","I_HTA"],
  ["R_BOC","R_SLO"],["R_ATE","R_INS"],["R_REG","R_SMA"],
  ["B_FLA","B_BOT"],["B_FRA","B_BAU"],["B_PIN","B_PAU"],["B_COR","B_PAU"],
  ["U_NAC","U_PEN"],["U_AGU","U_GOE"]];
function isRival(a,b){return RIVALS.some(function(r){return (r[0]===a&&r[1]===b)||(r[0]===b&&r[1]===a)})}
function derbyResult(pa,pb,opp){
  if(!isRival(S.my,opp))return;
  var dd=pa>pb?2:-2;
  S.rep=clamp(S.rep+dd,0,100);
  S.derT=S.derT||{w:0,l:0};if(pa>pb)S.derT.w++;else S.derT.l++;
  addNews((pa>pb?"¡Ganaste el clásico ante ":"Perdiste el clásico ante ")+TEAMS[opp].name+" ("+pa+"-"+pb+"). Reputación "+(dd>0?"+":"")+dd+".","cla");
}

/* ---------- Lesiones con decisiones ---------- */
function injAsk(p,g){if(g>=3)(S.injq=S.injq||[]).push({n:p.name,g:g})}
function injCard(){
  var q=(S.injq||[]).filter(function(x){return S.inj[x.n]>0&&TEAMS[S.my].pl.some(function(p){return p.name===x.n})});
  S.injq=q;
  if(!q.length)return "";
  var x=q[0],g=S.inj[x.n],ng=Math.max(1,Math.ceil(g/2));
  return '<div class="card offer"><h2>Decisión médica</h2><p><b>'+x.n+'</b> está lesionado: le faltan '+g+(g===1?' partido':' partidos')+'.</p>'+
    '<button class="opt" onclick="injDecide(false)"><b>Recuperación normal</b><span>Vuelve en '+g+(g===1?' partido':' partidos')+', sin riesgos</span></button>'+
    '<button class="opt" onclick="injDecide(true)"><b>Apurar la vuelta</b><span>Vuelve en '+ng+(ng===1?' partido':' partidos')+', pero juega 4 partidos disminuido y puede recaer</span></button></div>';
}
function injDecide(rush){
  var q=S.injq&&S.injq.shift();
  if(q&&rush&&S.inj[q.n]>0){
    var ng=Math.max(1,Math.ceil(S.inj[q.n]/2));
    S.inj[q.n]=ng;S.rush=S.rush||{};S.rush[q.n]={k:4,g:q.g};
    refreshStr();
    addNews("Apuraste la vuelta de "+q.n+": vuelve en "+ng+(ng===1?" partido":" partidos")+" y jugará disminuido un tiempo.","les");
  }
  save();showHub();
}
function rushTick(){
  var R=S.rush||{},m=S.inj;
  Object.keys(R).forEach(function(n){
    if(m[n]>0)return;
    R[n].k--;
    if(Math.random()<0.08){m[n]=R[n].g;delete R[n];addNews(n+" recayó de su lesión por volver antes de tiempo: fuera "+m[n]+" partidos.","les");return}
    if(R[n].k<=0){delete R[n];addNews(n+" ya está recuperado del todo.","les")}
  });
}

/* ---------- Entrenamiento ---------- */
var TRNOW=false;
var TRF={bal:["Equilibrado","Mejora un poco todo"],atk:["Ataque","Más progreso en ataque, algo menos en defensa"],def:["Defensa","Más progreso en defensa, algo menos en ataque"],jov:["Jóvenes","Los jóvenes progresan mucho más; el resto, un poco menos"]};
function trState(){if(!S.tr)S.tr={f:"bal",sp:[]};return S.tr}
function trBonus0(n){
  var T=trState(),tag=tagOf(null,{name:n}),eo=0,ed=0;
  if(T.f==="bal"){eo=0.3;ed=0.3}
  else if(T.f==="atk"){eo=0.8;ed=-0.3}
  else if(T.f==="def"){eo=-0.3;ed=0.8}
  else if(T.f==="jov"){if(tag==="J"){eo=1;ed=1}else{eo=-0.3;ed=-0.3}}
  if(T.sp.indexOf(n)>=0){eo+=1.2;ed+=1.2}
  return [eo,ed];
}
function trainMid(){
  var ups=[];
  TEAMS[S.my].pl.forEach(function(p){
    var b=trBonus(p.name),t=[];
    if(b[0]>0&&Math.random()<b[0]/4&&p.off<99){p.off++;t.push("+1 ATQ")}
    if(b[1]>0&&Math.random()<b[1]/4&&p.def<99){p.def++;t.push("+1 DEF")}
    if(t.length){S.rt[p.name]=[p.off,p.def];ups.push(p.name+" ("+t.join(", ")+")")}
  });
  sortTeam(S.my);refreshStr();
  addNews(ups.length?"Entrenamiento de mitad de temporada: mejoraron "+ups.join(", ")+".":"Entrenamiento de mitad de temporada: esta vez no hubo mejoras visibles.","ent");
}
function setTrF(f){trState().f=f;save();showTraining()}
function trSp(i){
  var T=trState(),p=TEAMS[S.my].pl[i];if(!p)return;
  T.sp=T.sp.filter(function(n){return TEAMS[S.my].pl.some(function(q){return q.name===n})});
  var k=T.sp.indexOf(p.name);
  if(k>=0)T.sp.splice(k,1);else if(T.sp.length<2)T.sp.push(p.name);else{T.sp.shift();T.sp.push(p.name)}
  save();showTraining(true);
}
function showTraining(keep){
  var T=trState();
  var h='<h1>Entrenamiento</h1><p class="muted">El foco del equipo cambia cuánto progresa cada jugador al terminar la temporada. En la fecha '+(S.sched?midR():'-')+' hay un entrenamiento de mitad de año que también puede mejorar a algunos.</p><h2 style="margin-top:12px">Foco del equipo</h2>';
  Object.keys(TRF).forEach(function(k){h+='<button class="opt'+(T.f===k?' sel':'')+'" onclick="setTrF(\''+k+'\')"><b>'+TRF[k][0]+'</b><span>'+TRF[k][1]+'</span></button>'});
  h+='<h2 style="margin-top:12px">Entrenamiento individual</h2><p class="muted">Elegí hasta 2 jugadores para trabajar aparte: progresan bastante más.</p>';
  TEAMS[S.my].pl.forEach(function(p,i){h+='<button class="opt'+(T.sp.indexOf(p.name)>=0?' sel':'')+'" onclick="trSp('+i+')"><b>'+p.name+'</b><span>'+p.pos+' · '+tagLabel(tagOf(null,p))+' · ATQ '+p.off+' · DEF '+p.def+'</span></button>'});
  $(h+'<button class="primary" onclick="showHub()">Volver</button>',keep);

/* ---------- Mundial de clubes ---------- */
var WCST=["Semifinal","Final"],WCB={semis:2,final:5,campeon:10},WCL={semis:"semifinal",final:"subcampeón",campeon:"¡campeón!"};
function adjOf(id){var c=curCx();return c&&c.adj&&c.adj[id]||0}
function wcTeams(){
  var out=[],or={};
  function add(id,l){if(id&&TEAMS[id]&&out.indexOf(id)<0&&out.length<4){out.push(id);or[id]=l}}
  function loser(g){return g&&g.w!=null?(g.w===g.a?g.b:g.a):null}
  add(S.champ,"campeón "+LC().name);
  if(S.cup&&S.cup.el)add(S.cup.el.champ,"campeón EuroLeague");
  if(S.cup&&S.cup.cla)add(S.cup.cla.champ,"campeón Champions Américas");
  if(S.lg!=="nba")add(pick(LIDS("nba").sort(function(a,b){return BASE[b].ovr-BASE[a].ovr}).slice(0,4)),"campeón NBA");
  if(S.cup&&S.cup.el&&S.cup.el.kos[2])add(loser(S.cup.el.kos[2][0]),"finalista EuroLeague");
  if(S.po&&S.po.games)add(loser(S.po.games[0]),"finalista "+LC().name);
  if(S.cup&&S.cup.cla&&S.cup.cla.kos[2])add(loser(S.cup.cla.kos[2][0]),"finalista Champions Américas");
  return {t:out,or:or};
}
function wcCx(){
  var adj={},l=0;
  S.wc.t.forEach(function(id){if(TEAMS[id].lg==="nba")adj[id]=-11;l+=LGL[TEAMS[id].lg]});
  return {P:88,lg:l/S.wc.t.length,poss:82,adj:adj};
}
function wcGames(){return S.wc.st===0?S.wc.g:[S.wc.f]}
function wcMyOpp(){
  if(!S.wc||S.wc.done)return null;
  var gs=wcGames();
  for(var i=0;i<gs.length;i++){var g=gs[i];if(g.w!=null)continue;if(g.a===S.my)return g.b;if(g.b===S.my)return g.a}
  return null;
}
function wcPlay(g,r){g.sa=r[0];g.sb=r[1];g.w=r[0]>r[1]?g.a:g.b;tire(g.a);tire(g.b)}
function wcStep(){
  var W=S.wc,cx=wcCx();
  wcGames().forEach(function(g){if(g.w==null&&g.a!==S.my&&g.b!==S.my)wcPlay(g,simGame(g.a,g.b,cx))});

  v.sort(function(a,b){return b-a});v=v.slice(0,5);

  if(gap>45)return {ok:false,why:"No quiere bajar a una liga de menos nivel."};
  if(gap>20&&lvl>=lgTop(S.lg))return {ok:false,why:"Es demasiado bueno para tu liga: prefiere seguir donde está."};

  }
  t.pl.splice(i,1);TEAMS[S.my].pl.push(p);S.own[p.name]=S.my;morSet(p.name,72);
  if(!bt.keep){S.sal[p.name]=bt.sal;S.yrs[p.name]=bt.yrs;setLg(p.name,S.lg);if(S.en)delete S.en[p.name]}
  mleMark(pr0,S.sal[p.name]||0);
  S.tb[S.my]-=amt;S.tb[id]=(S.tb[id]||0)+amt;
  sortTeam(S.my);sortTeam(id);rebuildBase();refreshStr();
  addNews("Fichaste a "+p.name+" de "+t.name+(bt.keep?"":" ("+LSHORT[t.lg]+")")+" por "+amt+" M.","mer");save();
  showBuy(id,"¡"+p.name+" es tu nuevo jugador! Pagaste "+amt+" M"+(bt.keep?"":" y firmó por "+bt.sal+" M al año")+".");
}
function makeOffer(){
  if(!euroMkt()||!marketOpen()||Math.random()>0.22)return;
  tbFill();
  var mine=TEAMS[S.my].pl;if(mine.length<=8)return;
  var p=pick(mine.slice(0,9));if(!p||(S.offs||[]).some(function(o){return o.n===p.name}))return;
  var sal=S.sal[p.name]||0,pr=price(S.my,p),my=LP[S.lg]||50;
  var buyers=shuffle(PLAYLG().filter(function(lg){return lg===S.lg||(LP[lg]||0)>=my}).reduce(function(a,lg){return a.concat(LIDS(lg))},[]).filter(function(id){
    var other=TEAMS[id].lg!==S.lg,lvl=(p.off+p.def)/2;
    if(other&&lvl<lgTop(TEAMS[id].lg)-12)return false;
    return id!==S.my&&TEAMS[id].pl.length<12&&capOK(id,p.name)&&payroll(id)+sal<=S.bud[id]*1.08&&(S.tb[id]||0)>=pr*0.9;
  }));
  if(!buyers.length)return;
  var amt=Math.round(pr*rnd(0.9,1.3)),b=buyers[0];
  amt=Math.min(amt,S.tb[b]);
  S.offs=(S.offs||[]).concat([{n:p.name,t:b,a:amt,r:S.rnd}]);
  addNews(TEAMS[b].name+(TEAMS[b].lg!==S.lg?" ("+LSHORT[TEAMS[b].lg]+")":"")+" ofrece "+amt+" M por "+p.name+". Respondé en la pantalla principal.","mer");
}
function offersHTML(){
  if(!euroMkt())return "";

  return S.offs.map(function(o,i){
    var lg=TEAMS[o.t].lg;
    return '<div class="card offer"><h2>Oferta por '+o.n+'</h2><p>'+TEAMS[o.t].name+(lg!==S.lg?' ('+LSHORT[lg]+')':'')+' ofrece <b>'+o.a+' M</b> de traspaso. La plata se suma a tu presupuesto de fichajes.</p>'+
      '<div class="two"><button class="primary" style="font-size:15px;padding:10px" onclick="answerOffer('+i+',true)">Aceptar</button><button class="ghost" onclick="answerOffer('+i+',false)">Rechazar</button></div></div>';

}
function answerOffer(i,yes){

function faList(lg,mine){

  });

/* ---------- Moral ---------- */
function morOf(n){return S&&S.mor&&S.mor[n]!=null?S.mor[n]:65}
function morF(n){return 0.96+0.06*morOf(n)/100}
function morSet(n,v){S.mor=S.mor||{};S.mor[n]=Math.round(clamp(v,0,100))}
function morWord(v){return v>=70?"contento":v>=40?"normal":"descontento"}
function morHTML(n){var v=morOf(n);return '<span class="'+(v>=70?"win":v>=40?"":"lose")+'">'+morWord(v)+'</span>'}
function moraleAfter(win){
  var m=injMap(),RT=S.rest||{},k=0;
  TEAMS[S.my].pl.forEach(function(p){
    var n=p.name,v=morOf(n),hurt=m[ikey(S.my,p)]>0,d=win?1.5:-1.5;
    if(!hurt&&!RT[n]){d+=k<5?1:k<8?0:-2.5;k++}
    v+=d+(62-v)*0.04;
    var was=morOf(n);morSet(n,v);
    if(was>=30&&morOf(n)<30)addNews(n+" está descontento: quiere más minutos o mejores resultados.","dir");
  });
}
function morSeason(){
  var M=S.mor||{},in_={};
  TEAMS[S.my].pl.forEach(function(p){in_[p.name]=1});
  Object.keys(M).forEach(function(n){if(!in_[n])delete M[n];else M[n]=Math.round(M[n]+(65-M[n])*0.5)});
  S.talk={};
}
function talkP(i){
  var p=TEAMS[S.my].pl[i];if(!p)return;
  S.talk=S.talk||{};
  if(S.talk[p.name]!=null&&S.rnd-S.talk[p.name]<5){showRoster("Ya hablaste con "+p.name+" hace poco. Esperá unas fechas.");return}
  S.talk[p.name]=S.rnd||0;
  var r=Math.random(),v=morOf(p.name),msg;
  if(r<0.65){morSet(p.name,v+10);msg="La charla con "+p.name+" salió bien: está más motivado."}
  else if(r<0.9){morSet(p.name,v+3);msg=p.name+" te escuchó, pero no quedó del todo convencido."}
  else{morSet(p.name,v-5);msg="La charla con "+p.name+" salió mal: se lo tomó a mal."}
  refreshStr();save();showRoster(msg);
}
function canTalk(n){return !(S.talk&&S.talk[n]!=null&&S.rnd-S.talk[n]<5)}

/* ---------- Negociación de contratos ---------- */
function startContracts(){
  var ex=TEAMS[S.my].pl.filter(function(p){return (S.yrs[p.name]||1)<=1}).map(function(p){
    var tag=tagOf(null,p),v=morOf(p.name),ask=estSal(p.off,p.def,tag);
    var k=v>=75?0.9:v<35?1.2:1;

  });

function lowAsk(it){return Math.max(1,Math.round(it.ask*0.85))}
function showContracts(msg){

      (it.neg||lo>=it.ask?'<button class="ghost" onclick="letGoC('+i+')">Dejar ir</button></div>':'<button class="ghost" onclick="offerC('+i+')">Ofrecer '+lo+' M</button></div><button class="ghost" style="margin-top:8px" onclick="letGoC('+i+')">Dejar ir</button>')}
    h+='<div class="card" style="padding:12px"><div class="row"><div><div style="font-weight:600">'+it.name+'</div><div class="muted">'+a.pos+' · '+tagLabel(tag)+' · ATQ '+r.off+' · DEF '+r.def+' · ánimo '+morHTML(it.name)+'</div></div></div>'+
       '<p class="muted" style="margin:6px 0 0">Gana '+Math.round(cur)+' M. Pide '+it.ask+' M por '+it.yrs+(it.yrs===1?' año':' años')+'.'+(it.mood==="good"?' Está contento y te hace precio.':it.mood==="bad"?' Está descontento y pide más para quedarse.':'')+(it.neg&&!it.done?' Ya rechazó una oferta tuya.':'')+'</p>'+(it.done?'<p style="margin:6px 0 0">'+body+'</p>':body)+'</div>';
  });

function renewC(i){
  var it=S.cx.list[i];if(!it||it.done)return;
  if(renBlock(it.name,it.ask)){showContracts("No te entra en el tope de sueldos para renovar a "+it.name+".");return}

}
function offerC(i){

function signFA(i,low){

/* ---------- Finanzas del club ---------- */
var TIX={b:{n:"Barata",m:0.8,f:0.15},n:{n:"Normal",m:1,f:0},c:{n:"Cara",m:1.3,f:-0.18}};
function finK(){return S.bud[S.my]||20}
function fyNew(){S.fy={club:S.my,start:S.tb[S.my]||0,tv:0,sp:0,gate:0,prize:0,sal:0,home:0,fill:null}}
function fyFix(){if(!S.fy||S.fy.club!==S.my)fyNew()}
function tbInit(){
  var keep=S.fy&&S.fy.club===S.my&&S.tb&&S.tb[S.my]!=null?S.tb[S.my]:null;
  S.tb={};
  PLAYLG().forEach(function(lg){LIDS(lg).forEach(function(id){
    var b=payroll(id)*0.25;
    if(id===S.my)b*=0.8+S.rep/250;
    S.tb[id]=Math.max(2,Math.round(b));
  })});
  if(keep!=null)S.tb[S.my]=keep;
  S.offs=[];
  fyNew();
}
function r1(x){return Math.round(x*10)/10}
function fmtM(x){x=r1(x);return (x<0?"−":"")+Math.abs(x).toFixed(1).replace(".",",")+" M"}
function fillOf(){
  var st=S.st[S.my]||{w:0,l:0},g=st.w+st.l,wp=g?st.w/g:0.5,t=TIX[S.tix||"n"];
  return clamp(0.76+0.2*(S.rep-50)/50+0.03*clamp(S.strk||0,-5,5)+(wp-0.5)*0.4+t.f,0.25,1);
}
function isHome(){if(S.hv){var h=regHome(S.rnd,S.my);if(h!=null)return h}fyFix();return (S.fy.g||0)%2===0}
function finRound(home){
  fyFix();
  var K=finK(),R=S.sched.length||1,F=S.fy;
  var tv=0.32*K/R,sp=0.3*K*(0.7+0.6*S.rep/100)/R,sal=payroll(S.my)/R,g=0;
  if(home){var f=fillOf();g=0.38*K/(R/2)*f*TIX[S.tix||"n"].m;F.home++;F.fill=Math.round(f*100)}
  F.g=(F.g||0)+1;F.tv+=tv;F.sp+=sp;F.gate+=g;F.sal+=sal;
  S.tb[S.my]=r1((S.tb[S.my]||0)+tv+sp+g-sal);
}
function finSeasonEnd(){
  fyFix();
  var K=finK(),F=S.fy,cb=0;
  (S.fin&&S.fin.cups||[]).forEach(function(c){cb+=c.b||0});
  var pr=K*(0.03*(S.poWins||0)+(S.champ===S.my?0.06:0)+0.01*cb+(S.fin&&S.fin.wc?0.01*(S.fin.wc.b||0):0));
  if(pr>0){F.prize+=pr;S.tb[S.my]=r1((S.tb[S.my]||0)+pr)}
  var lt=luxTax();if(lt>0){F.tax=lt;S.tb[S.my]=r1((S.tb[S.my]||0)-lt);addNews("El club pagó "+fmtM(lt)+" de impuesto de lujo por terminar la temporada con "+Math.round(payroll(S.my))+" M en sueldos (la línea es "+capL().tax+" M).","dir")}
  var cash=S.tb[S.my]||0;
  if(cash<0){
    S.rep=clamp(S.rep-3,0,100);S.bud[S.my]=Math.round(S.bud[S.my]*0.96);
    addNews("La directiva está enojada con las cuentas: la caja terminó en "+fmtM(cash)+". Baja el tope de sueldos y perdés reputación.","dir");
  }else if(cash>=0.3*K){
    S.bud[S.my]=Math.round(S.bud[S.my]*1.03);
    addNews("Las cuentas del club están sanas ("+fmtM(cash)+" en caja). La directiva sube el tope de sueldos.","dir");
  }
}
function setTix(k){S.tix=k;save();showFinance()}
function showFinance(){
  fyFix();
  var F=S.fy,K=finK(),R=S.sched.length||1,cash=S.tb[S.my]||0;
  var tr=cash-(F.start+F.tv+F.sp+F.gate+F.prize-F.sal-(F.st||0)-(F.tax||0));

function suggestSubs(){
  if(!M||M.done)return [];
  var c=court(),out=[],used={},res=[],F=FMAX();
  var last=M.i>=M.n-1;
  c.forEach(function(p,i){
    var why=null,u=0;
    if(p.pf>=F-1&&!last){why=p.pf+" faltas";u=200}
    else if(p.en<55){why="cansado, "+Math.round(p.en)+"%";u=100-p.en}
    if(why)out.push({ci:i,why:why,u:u});
  });
  out.sort(function(a,b){return b.u-a.u});
  out.forEach(function(x){
    if(res.length>=3)return;
    var o=c[x.ci],bi=-1,bs=-1e9;
    M.roster.forEach(function(p,j){
      if(j<5||p.out||used[j])return;
      if(x.u<200&&p.en<o.en+10)return;
      if(p.en<45)return;
      var v=subFit(o,p);if(v>bs){bs=v;bi=j}
    });
    if(bi>=0){used[bi]=1;res.push({ci:x.ci,bi:bi,why:x.why})}
  });
  var bc={},bb={};res.forEach(function(r){bc[r.ci]=1;bb[r.bi]=1});
  rotPlan(M.roster,bc,bb,3,res);res.forEach(function(r){used[r.bi]=1});
  /* Vuelve un jugador mejor que ya descansó */
  if(res.length<3){
    var busy={};res.forEach(function(r){busy[r.ci]=1});
    M.roster.forEach(function(p,j){
      if(res.length>=3||j<5||p.out||used[j]||p.en<85||(M.sit&&M.sit[p.name]>M.i))return;
      var q=(p.off+p.def)/2,wi=-1,wq=1e9;

      if(wi>=0&&q*(0.6+0.4*p.en/100)>=wq+5){used[j]=1;busy[wi]=1;res.push({ci:wi,bi:j,why:"vuelve descansado"})}
    });
  }
  return res;
}

      r.push({name:f.name,pos:f.pos,off:f.off,def:f.def,tag:f.tag,lg:lg,id:null,sal:f.ask,fee:0,yrs:f.yrs,why:why});

  return r.filter(function(x){
    if(SF.pos!=="all"&&x.pos!==SF.pos)return false;
    if(x.off<SF.off||x.def<SF.def)return false;
    if(SF.age!=="all"&&x.tag!==SF.age)return false;

function b64(u8){var s="",i;for(i=0;i<u8.length;i+=32768)s+=String.fromCharCode.apply(null,u8.subarray(i,i+32768));return btoa(s)}
function unb64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function packState(){
  var js=JSON.stringify(S);
  if(typeof CompressionStream==="function"){
    try{var cs=new Blob([js]).stream().pipeThrough(new CompressionStream("gzip"));
      return new Response(cs).arrayBuffer().then(function(ab){return "BM1:"+b64(new Uint8Array(ab))}).catch(function(){return "BM0:"+js})}catch(e){}
  }
  return Promise.resolve("BM0:"+js);
}
function unpackState(code){
  code=(code||"").trim();
  try{
    code=code.replace(/bm([01]):/i,"BM$1:");
    if(code.indexOf("BM0:")===0)return Promise.resolve(JSON.parse(code.slice(4)));
    var i0=code.indexOf("BM0:{");if(i0>0)return unpackState(code.slice(i0).replace(/\}[^}]*$/,"}"));
    var re=/BM1:[A-Za-z0-9+\/=]+/,m=code.match(re);if(!m||(m[0].length-4)%4)m=code.replace(/\s+/g,"").match(re)||m;code=m?m[0]:code.replace(/\s+/g,"");
    if(code.indexOf("BM1:")===0){
      if(typeof DecompressionStream!=="function")return Promise.reject("nozip");
      if((code.length-4)%4)return Promise.reject("corto");
      var ds=new Blob([unb64(code.slice(4))]).stream().pipeThrough(new DecompressionStream("gzip"));
      return new Response(ds).text().then(function(t){return JSON.parse(t)},function(){throw "corto"});
    }
    if(code.charAt(0)==="{")return Promise.resolve(JSON.parse(code));
  }catch(e){return Promise.reject(e)}
  return Promise.reject("formato");
}

var CHUNK=120000;
function cloudPath(k){return "data/users/"+CL.uid+"/"+k}
function cloudInit(){
  saveBtn();
  if(!window.claude||typeof claude.use!=="function"){CL.state="sin";CL.ready=true;return}
  Promise.all([claude.use("db"),claude.use("user")]).then(function(r){
    var db=r[0],us=r[1];if(!db||!us){CL.state="sin";CL.ready=true;return null}
    return us.id().then(function(id){
      if(!id){CL.state="sin";CL.ready=true;return null}
      CL.db=db;CL.uid=id;
      return db.doc(cloudPath("save")).get().then(function(snap){
        var m=snap.exists?snap.data():null;
        if(m&&m.n>0&&m.ts>LOCAL_TS0)return cloudRead(m).then(function(o){
          if(validState(o)){CL.pending=o;CL.at=m.ts;tryApplyPending()}
          else finishInit();
        });
        if(m&&m.n>0){CL.ok=true;CL.at=m.ts}
        finishInit();
      });
    });
  }).catch(function(){CL.state="error";CL.ready=true});
}
function finishInit(){CL.ready=true;CL.state="ok";if(S&&S.my&&(S._ts||0)>CL.at)cloudQueue(true)}
function cloudRead(m){
  var ps=[];for(var i=0;i<m.n;i++)ps.push(CL.db.doc(cloudPath("p"+m.slot+i)).get());
  return Promise.all(ps).then(function(snaps){
    var code="";for(var i=0;i<snaps.length;i++){if(!snaps[i].exists)return null;code+=snaps[i].data().d}
    return unpackState(code);
  }).catch(function(){return null});
}

function cloudQueue(now){

function cloudWrite(){
  if(!CL.dirty||!CL.db)return Promise.resolve(CL.ok);
  if(navigator.onLine===false){CL.state="error";offBar();return Promise.resolve(false)}
  if(CL.busy)return new Promise(function(res){setTimeout(function(){res(cloudWrite())},400)});
  CL.busy=true;CL.dirty=false;
  var ts=S._ts||Date.now(),info={season:S.season,team:S.my,rep:S.rep};
  return packState().then(function(code){
    var n=Math.ceil(code.length/CHUNK);
    return CL.db.doc(cloudPath("save")).get().then(function(snap){
      var old=snap.exists?snap.data():null,slot=old&&old.slot==="a"?"b":"a";
      var i=0;
      function next(){
        if(i>=n)return CL.db.doc(cloudPath("save")).set({slot:slot,n:n,ts:ts,season:info.season,team:info.team,rep:info.rep});
        var k=i++;return CL.db.doc(cloudPath("p"+slot+k)).set({d:code.slice(k*CHUNK,(k+1)*CHUNK)}).then(next);
      }
      return next();
    });
  }).then(function(){CL.busy=false;CL.ok=true;CL.at=ts;CL.state="ok";offBar();return true},
    function(){CL.busy=false;CL.ok=false;CL.state="error";CL.dirty=true;offBar();return false});
}

<script>
/* ---------- v28: sonido de partido y pantalla encendida ---------- */
var SND={ctx:null,crowd:null,last:{},nb:null};
function sndOn(){return !(S&&S.snd===0)}
function sndCtx(){
  try{
    if(!SND.ctx){var A=window.AudioContext||window.webkitAudioContext;if(!A)return null;
      if(navigator.audioSession)try{navigator.audioSession.type="ambient"}catch(e){}
      SND.ctx=new A()}
    if(SND.ctx.state!=="running")SND.ctx.resume();
  }catch(e){return null}
  return SND.ctx;
}
document.addEventListener("touchend",function(){if(SND.ctx&&SND.ctx.state!=="running")sndCtx()},{passive:true});
function sndNoise(){
  var c=SND.ctx;if(SND.nb)return SND.nb;
  var n=c.sampleRate*2,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0),l=0,i,w;
  for(i=0;i<n;i++){w=Math.random()*2-1;l=(l+0.04*w)/1.04;d[i]=l*3.5+w*0.15}
  SND.nb=b;return b;
}
function sndSrc(f,q,type){
  var c=SND.ctx,s=c.createBufferSource(),fl=c.createBiquadFilter();
  s.buffer=sndNoise();s.loop=true;s.playbackRate.value=0.8+Math.random()*0.4;
  fl.type=type||"bandpass";fl.frequency.value=f;fl.Q.value=q;s.connect(fl);return {s:s,f:fl};
}
function sndEnv(g,t,a,peak,dec){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec)}
function crowdLevel(v){
  var c=SND.ctx;if(!c)return;
  if(!SND.crowd){if(!v)return;
    var x=sndSrc(700,0.6),g=c.createGain(),lf=c.createOscillator(),lg=c.createGain();
    g.gain.value=0;lf.frequency.value=0.13;lg.gain.value=0.012;lf.connect(lg);lg.connect(g.gain);
    x.f.connect(g);g.connect(c.destination);x.s.start();lf.start();SND.crowd={g:g}}
  SND.crowd.g.gain.setTargetAtTime(v,c.currentTime,0.6);
}
function sndCheer(t,peak,dur){
  var c=SND.ctx,x=sndSrc(1000,0.7),y=sndSrc(2200,1.2),g=c.createGain();
  x.f.connect(g);y.f.connect(g);g.connect(c.destination);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+0.25);g.gain.setTargetAtTime(0.0001,t+0.4,dur/3);
  x.s.start(t);y.s.start(t);x.s.stop(t+dur+0.5);y.s.stop(t+dur+0.5);
}
function sndPlay(k){
  var c=SND.ctx;if(!sndOn()||!c||c.state!=="running")return;
  var now=c.currentTime;if(SND.last[k]&&now-SND.last[k]<0.25)return;SND.last[k]=now;
  var t=now+0.02,o,g,x,lf,lg;
  if(k==="bounce"){
    for(var i=0;i<2;i++){o=c.createOscillator();g=c.createGain();o.type="sine";var ti=t+i*0.28;
      o.frequency.setValueAtTime(170,ti);o.frequency.exponentialRampToValueAtTime(55,ti+0.12);
      sndEnv(g,ti,0.004,i?0.25:0.4,0.14);o.connect(g);g.connect(c.destination);o.start(ti);o.stop(ti+0.2)}
  }else if(k==="swish"){
    x=sndSrc(4500,0.9);g=c.createGain();x.f.frequency.setValueAtTime(5500,t);x.f.frequency.exponentialRampToValueAtTime(1600,t+0.3);
    sndEnv(g,t,0.03,0.35,0.3);x.f.connect(g);g.connect(c.destination);x.s.start(t);x.s.stop(t+0.4);
  }else if(k==="mine"){sndPlay("swish");sndCheer(t+0.1,0.16,1.4)}
  else if(k==="three"){sndPlay("swish");sndCheer(t+0.1,0.3,2.4)}
  else if(k==="opp"){sndPlay("swish");sndCheer(t+0.1,0.06,0.9)}
  else if(k==="whistle"){
    o=c.createOscillator();g=c.createGain();lf=c.createOscillator();lg=c.createGain();
    o.frequency.value=2650;lf.frequency.value=38;lg.gain.value=140;lf.connect(lg);lg.connect(o.frequency);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.14,t+0.02);g.gain.setValueAtTime(0.14,t+0.32);g.gain.exponentialRampToValueAtTime(0.0001,t+0.42);
    o.connect(g);g.connect(c.destination);o.start(t);lf.start(t);o.stop(t+0.45);lf.stop(t+0.45);
  }else if(k==="buzz"){
    g=c.createGain();var fl=c.createBiquadFilter();fl.type="lowpass";fl.frequency.value=1400;fl.connect(g);g.connect(c.destination);
    [196,199].forEach(function(f){var q=c.createOscillator();q.type="square";q.frequency.value=f;q.connect(fl);q.start(t);q.stop(t+1.1)});
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.12,t+0.03);g.gain.setValueAtTime(0.12,t+0.95);g.gain.exponentialRampToValueAtTime(0.0001,t+1.1);
  }
}
function sndLine(e){
  if(!M||!M.run||!e||typeof e.me!=="number")return;
  var dm=e.me-M.dMe,dop=e.op-M.dOp;
  if(/falta|Tiempo muerto/i.test(e.t))sndPlay("whistle");
  if(dm>0)sndPlay(dm>=3?"three":"mine");
  else if(dop>0)sndPlay("opp");
  else if(/rebote/i.test(e.t))sndPlay("bounce");
}
function sndBtn(){var on=sndOn();return '<button class="ghost lvsnd" style="width:auto;padding:8px 14px" onclick="sndToggle()" aria-pressed="'+on+'">'+(on?"🔊 Sonido":"🔇 Sin sonido")+'</button>'}
function sndToggle(){

  var on=sndOn();Array.prototype.forEach.call(document.querySelectorAll(".lvsnd"),function(b){b.textContent=on?"🔊 Sonido":"🔇 Sin sonido";b.setAttribute("aria-pressed",on)});

/* Pantalla encendida mientras corre el partido (iPhone: iOS 18.4 o más nuevo) */
var WL={lock:null,want:false};
function wakeSet(on){
  WL.want=on;
  if(!("wakeLock" in navigator))return;
  if(on&&!WL.lock&&document.visibilityState==="visible"){
    WL.lock="pidiendo";
    navigator.wakeLock.request("screen").then(function(l){
      if(!WL.want){l.release().catch(function(){});WL.lock=null;return}
      WL.lock=l;l.addEventListener("release",function(){if(WL.lock===l)WL.lock=null});
    }).catch(function(){WL.lock=null});
  }else if(!on&&WL.lock&&WL.lock!=="pidiendo"){var l=WL.lock;WL.lock=null;l.release().catch(function(){})}
}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&WL.want)wakeSet(true)});
function matchEnv(){
  var im=typeof M!=="undefined"&&M&&!M.done&&M.roster,run=!!(im&&M.run);

<script>

<script>
/* ---------- v30: rotación (los titulares descansan y vuelven) ---------- */
function rotCount(L){L.forEach(function(p,j){if(j<5){p.ct=(p.ct||0)+1;p.bt=0}else{p.bt=(p.bt||0)+1;p.ct=0}})}
function rotPlan(L,busyC,busyB,max,res){
  if(max<=0)return res;
  var late=M.i>=M.n-2&&Math.abs(M.me-M.op)<=12,F=FMAX(),mine=L===M.roster;
  var sat=function(p){return mine&&M.sit&&M.sit[p.name]>M.i};
  L.forEach(function(p,j){
    if(res.length>=max||j<5||p.out||busyB[j]||!p.st||p.en<85||sat(p))return;
    if(!late&&((p.bt||0)<2||p.pf>=F-1))return;
    var wi=-1,wq=1e9;
    for(var pass=0;pass<2&&wi<0;pass++)L.slice(0,5).forEach(function(o,i){if(o.st||busyC[i])return;if(pass===0&&posGrp(o.pos)!==posGrp(p.pos))return;var q=(o.off+o.def)/2;if(q<wq){wq=q;wi=i}});
    if(wi>=0){busyC[wi]=1;busyB[j]=1;res.push({ci:wi,bi:j,why:"vuelve descansado"})}
  });
  if(late)return res;
  L.slice(0,5).map(function(p,i){return {p:p,i:i}}).filter(function(x){return (x.p.ct||0)>=3&&!busyC[x.i]}).sort(function(a,b){return (b.p.ct-a.p.ct)||(a.p.en-b.p.en)}).forEach(function(x){
    if(res.length>=max)return;

    if(bi>=0){busyC[x.i]=1;busyB[bi]=1;res.push({ci:x.i,bi:bi,why:"descanso"})}
  });
  return res;
}

<script>
/* ---------- v34: marcas por posición y desajustes ---------- */
var SZ={PG:1,G:1.5,SG:2,SF:3,F:3.5,PF:4,C:5};
function sz(pos){return SZ[pos]||3}
function lastN(n){var s=sn(n),i=s.indexOf(". ");return i>=0?s.slice(i+2):s}
/* empareja por tamaño: el más chico con el más chico */
function pairBySize(att,def){
  var A=att.map(function(p,i){return {p:p,i:i}}).sort(function(x,y){return sz(x.p.pos)-sz(y.p.pos)||x.i-y.i});
  var D=def.map(function(p,i){return {p:p,i:i}}).sort(function(x,y){return sz(x.p.pos)-sz(y.p.pos)||x.i-y.i});
  var m={};A.forEach(function(x,k){m[x.p.name]=D[k]?D[k].p:null});return m;
}
/* quién marca a cada rival (con tu marca especial) */
function markMap(){
  var m=pairBySize(oppCourt(),court()),inv={};
  if(M.stop&&onCourt(M.stop)&&M.opp.mk&&oppCourt().some(function(p){return p.name===M.opp.mk})){
    var st=court().filter(function(x){return x.name===M.stop})[0],cur=m[M.opp.mk];
    if(cur&&cur!==st){var other=null;Object.keys(m).forEach(function(k){if(m[k]===st)other=k});if(other)m[other]=cur;m[M.opp.mk]=st}
  }
  Object.keys(m).forEach(function(k){if(m[k])inv[m[k].name]=oppCourt().filter(function(p){return p.name===k})[0]});
  return inv;
}
function defOf(sh,oppAtt){
  if(oppAtt){var inv=markMap(),r=null;Object.keys(inv).forEach(function(k){if(inv[k]===sh)r=court().filter(function(x){return x.name===k})[0]});return r}
  return pairBySize(court(),oppCourt())[sh.name]||null;
}
/* ventaja del atacante: 0 sin ventaja, hasta 2 */
function mmEdge(a,d,three){
  if(!d)return 0;var ds=sz(a.pos)-sz(d.pos);
  return three?Math.max(0,-ds-1):Math.max(0,ds-1);
}
function mmAdj(a,d,three){
  if(!d)return 0;var dt=court().indexOf(d)>=0?court():oppCourt(),av=0;dt.forEach(function(q){av+=q.a?q.a.dfn:60});av/=dt.length;
  var ds=sz(a.pos)-sz(d.pos),x=-((d.a?d.a.dfn:60)-av)/250;
  if(three)x+=0.02*Math.max(0,-ds)-0.005*Math.max(0,ds);

  return clamp(x,-0.1,0.1);

  if(S.deal&&TEAMS[S.deal])h+='<div class="card offer"><h2>Tu próximo club</h2><p>Acordaste dirigir a <b>'+TEAMS[S.deal].name+'</b>. '+(S.phase==="end"?'Confirmalo en la pantalla de fin de temporada.':'Al terminar la temporada vas a confirmar el cambio o quedarte donde estás.')+'</p></div>';
  if(!v.length)h+='<div class="card"><p class="muted" style="margin:0">Ahora no hay clubes buscando técnico. Cuando un club eche a su entrenador, lo vas a ver acá y en las noticias.</p></div>';
  v.forEach(function(x){
    var id=x.t,t=TEAMS[id],ch=vacChance(id),cw=ch>=0.7?"altas":ch>=0.4?"medias":ch>=0.15?"bajas":"muy bajas";
    h+='<div class="card"><div class="row"><b>'+t.name+'</b><span class="pill">'+LSHORT[t.lg]+'</span></div><p class="muted" style="margin:4px 0 8px">'+tier(id)+' · fuerza '+Math.round(BASE[id].ovr)+' · piden reputación de '+vacReq(id)+' · tus chances: <b>'+cw+'</b></p>'+
      (S.apl&&S.apl[id]?'<p class="lose" style="margin:0">Ya te postulaste: eligieron a otro.</p>':'<div class="two"><button class="ghost" onclick="vacLook(\''+id+'\')">Ver plantilla</button>'+(S.deal?'':'<button class="primary" onclick="vacApply(\''+id+'\')">Postularme</button>')+'</div>')+'</div>';
  });
  h+='<button class="ghost" style="margin-top:8px" onclick="'+(S.phase==="end"?'showEnd()':'showHub()')+'">Volver</button>';
  $(h);
}
function vacLook(id){
  var t=TEAMS[id];NAVTAB=S.phase==="end"?null:"more";
  $('<h1>'+t.name+'</h1><p class="muted">'+LSHORT[t.lg]+' · '+tier(id)+' · fuerza '+Math.round(BASE[id].ovr)+'</p><div class="card"><h2>Plantilla</h2>'+rosterHTML(id)+'</div><button class="ghost" onclick="showVac()">Volver</button>');
}
function endVacHTML(){
  var h="";
  if(S.deal&&TEAMS[S.deal])h+='<div class="card offer"><h2>Tu acuerdo con '+TEAMS[S.deal].name+'</h2><p>Durante la temporada te eligieron como su nuevo entrenador. Tocalo para confirmar el cambio'+(S.fin&&S.fin.fired?'.':', o seguí en tu club y el acuerdo se cae.')+'</p></div><button class="opt" onclick="showPreview(\''+S.deal+'\',\'offer\')"><b>'+TEAMS[S.deal].name+'</b><span>'+LSHORT[TEAMS[S.deal].lg]+' · '+tier(S.deal)+' · fuerza '+Math.round(BASE[S.deal].ovr)+'</span></button>';
  var n=(S.vac||[]).length;
  if(n)h+='<button class="ghost" style="margin-top:8px" onclick="showVac()">Clubes sin técnico ('+n+'): postularme</button>';
  return h;
}
var showMoreV=showMore;
showMore=function(){showMoreV();var a=document.getElementById("app"),b=a&&a.querySelector('button[onclick="showFinance()"]');if(b){var x=document.createElement("button");x.className="opt";x.setAttribute("onclick","showVac()");x.innerHTML='<b>Clubes sin técnico'+((S.vac||[]).length?' ('+S.vac.length+')':'')+'</b><span>Postulate para dirigir otro club</span>';b.parentNode.insertBefore(x,b)}};
</script>
